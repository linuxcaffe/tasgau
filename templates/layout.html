<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasgau - {{ title }}</title>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js"></script>
    <style>
        :root {
            --bg-main: white;
            --fg-main: black;
        
            --bg-sidebar: #161b22;
            --fg-sidebar: white;
        
            --highlight-color: #f0b100;
            --border-color: #657b83;
        
            --fg-accent-dim: #064e3b;
            --fg-accent: #059669;
            --fg-accent-bright: #a7f3d0;
        }


        @media(prefers-color-scheme: dark) {
            :root {
                --bg-main: #0d1117;
                --bg-hover: #222;
                --fg-main: white;
        
                /* --bg-sidebar: #161b22; */
                /* --fg-sidebar: white; */
        
                --border-color: #839496;
        
                --fg-accent-dim: #064e3b;
                --fg-accent: #059669;
                --fg-accent-bright: #a7f3d0;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            color: var(--fg-main);
            background: var(--bg-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        main {
            padding: 0.5em;
            flex-grow: 1;
        }

        header {
            color: white;
            background: var(--fg-accent);
            padding: 1em 2em;
        }

        .content {
            max-height: 100%;
        }

        .table-container {
            max-height: 80vh;
            overflow: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        thead {
            position: sticky;
            top: 0;
            background: var(--bg-main);
        }

        th {
            text-align: left;
            padding: 12px 15px;
            font-weight: 600;
            border-bottom: 2px solid #dee2e6;
        }
        
        td {
            padding: 12px 15px;
            border-bottom: 1px solid #dee2e6;
        }

        tbody tr:hover {
            background: var(--bg-hover);
        }
        
        tbody tr:last-child td {
            border-bottom: none;
        }
        
        .id-col,
        .age-col {
            display: none;
        }
        
        .flash {
            background: lightgreen;
            border-bottom: solid 1px green;
            width: 100%;
            text-align: center;
        }

        .pill {
            display: inline-flex;
            gap: 0.25em;
            padding: 0.25em 0.5em;
            font-size: 0.8rem;
            background: var(--fg-accent-dim);
            border-radius: 4px;
            border: solid 1px var(--fg-accent);
        }

        .pill .icon svg {
            width: 16px;
            height: 16px;
        }

        #create-task-btn {
            display:flex;
            place-items: center;
            justify-content: center;

            width: 2em;
            height: 2em;

            position: fixed;
            bottom: 1em;
            right: 1em;

            color: white;
            background: var(--fg-accent);
            border-radius:100%;

            font-size: 24pt;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
        }

        @media(min-width: 600px) {
            main { padding: 2em 1em; }
            .id-col {display: table-cell; width: 40px;}
            .age-col {display: table-cell; width: 80px;}
        }

    </style>
</head>
<body>
    <header>
      <h1>Tasgau</h1>
    </header>
    <main>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <div class="flash">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    
        <h2>{{title}}</h2>
        <div class="content">
	  {% block body %} {% endblock %}
        </div>
    </main>
</body>
</html>
